[workspace]
resolver = "2"
members = ["crates/*"]
# The installer embeds the built apps, so it is built on its own afterwards:
#   cargo build --release && cargo build --release -p archy-setup
default-members = [
    "crates/archy",
    "crates/archy-ui",
    "crates/archy-audio",
    "crates/archy-voice",
    "crates/archy-bench",
    "crates/archy-capture",
    "crates/archy-core",
    "crates/archy-encode",
    "crates/archy-gpu",
    "crates/archy-mux",
    "crates/archy-record",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
archy-gpu = { path = "crates/archy-gpu" }
archy-capture = { path = "crates/archy-capture" }
archy-encode = { path = "crates/archy-encode" }
archy-mux = { path = "crates/archy-mux" }
archy-core = { path = "crates/archy-core" }
archy-audio = { path = "crates/archy-audio" }
archy-voice = { path = "crates/archy-voice" }
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Devices_FunctionDiscovery",
    "Media_SpeechRecognition",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com_StructuredStorage",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "Win32_System_Performance",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
